[project]
name = "confluence-content-server"
version = "0.1.0"
description = "Local FastAPI preview server for Confluence Storage Format content"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "confluence-content-parser>=0.3.0",
    "fastapi>=0.116.1",
    "uvicorn>=0.35.0",
]

[tool.uv.sources]
confluence-content-parser = { path = "../confluence-content-parser", editable = true }
